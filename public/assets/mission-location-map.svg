    <radialGradient id="mars"><stop stop-color="#e7a06f"/><stop offset=".68" stop-color="#a74e34"/><stop offset="1" stop-color="#3c1a1a"/></radialGradient>
    <radialGradient id="glow"><stop stop-color="#9ecbff" stop-opacity=".6"/><stop offset="1" stop-color="#4d6fd7" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
